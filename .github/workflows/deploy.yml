name: Deploy Vertex Books to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, bcmath, gd, fileinfo
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Execute Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.DEPLOY_PATH || '/home/cpaneluser/public_html' }}"
            echo "Navigating to deployment target: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Pull latest commits
            if [ -d ".git" ]; then
                echo "Pulling latest changes from git..."
                git fetch origin main
                git reset --hard origin/main
            fi

            # 2. Put into maintenance mode
            echo "Activating maintenance mode..."
            php artisan down --render="errors::503" 2>/dev/null || true

            # 3. Install production dependencies
            echo "Installing composer dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # 4. Run database migrations safely
            echo "Running database migrations..."
            php artisan migrate --force

            # 5. Ensure storage symlink
            echo "Ensuring storage symlink..."
            php artisan storage:link 2>/dev/null || true

            # 6. Optimize caches for maximum speed
            echo "Optimizing application caches..."
            php artisan optimize:clear
            php artisan optimize
            php artisan view:cache
            php artisan event:cache

            # 7. Bring application back online
            echo "Deactivating maintenance mode..."
            php artisan up

            echo "Deployment to https://vertexhomeslk.com completed successfully!"
